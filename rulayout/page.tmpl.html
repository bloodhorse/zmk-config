<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>русский галлий</title>
<style>
  :root { --bg:#14161b; --key:#22252d; --key2:#2a2e38; --dim:#4a5060; --fg:#dde3ee; --mint:#7fd1b9; --pink:#e58fb7; --blue:#7fb6e5; --u:54px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-monospace, "SF Mono", Menlo, monospace; display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 24px; }
  #left { flex:0 0 auto; width:calc(var(--u) * 14.9); }
  #right { order:-1; width:calc(var(--u) * 14.9); }
  h1 { text-align:center; font-size:15px; font-weight:600; color:var(--blue); margin:0 0 14px; letter-spacing:.04em; }
  #board { position:relative; width:calc(var(--u) * 14.9); height:calc(var(--u) * 5.6); }
  .k { position:absolute; width:calc(var(--u) - 5px); height:calc(var(--u) - 5px); border-radius:8px; background:var(--key); display:flex; align-items:center; justify-content:center; user-select:none; transition:background .12s, box-shadow .12s; }
  .k.ns { background:#1b1d23; color:var(--dim); font-size:11px; }
  .k.seat { cursor:pointer; }
  .k.seat:hover { background:var(--key2); }
  .k .cy { font-size:24px; font-weight:500; }
  .k .gl { position:absolute; top:3px; left:6px; font-size:10px; color:var(--dim); }
  .k.twin .cy { color:var(--mint); }
  .k.twin .gl { color:var(--mint); opacity:.7; }
  .k.pin { box-shadow: inset 0 0 0 2px var(--mint); }
  .k.sel { box-shadow: inset 0 0 0 2px var(--blue); background:#2b3443; }
  .k.bad { animation: bad .35s; }
  @keyframes bad { 0%,100% { background:var(--key); } 50% { background:var(--pink); } }
  .k.next { background:#263848; box-shadow: inset 0 0 0 2px var(--blue); }
  .k.hit { background:#2d4a43; }
  .k .freq { position:absolute; bottom:2px; right:5px; font-size:9px; color:var(--dim); }
  .k.partner { box-shadow: inset 0 0 0 2px var(--pink); }
  #score { font-size:40px; font-weight:600; color:var(--mint); }
  #score small { font-size:13px; color:var(--blue); font-weight:400; margin-left:10px; }
  table { border-collapse:collapse; }
  td { padding:1px 10px 1px 0; }
  td.v { text-align:right; color:var(--fg); }
  td.l { color:var(--blue); }
  td.d.up { color:var(--pink); } td.d.dn { color:var(--mint); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  button { background:var(--key); color:var(--fg); border:1px solid #333845; border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  button.on { border-color:var(--mint); color:var(--mint); }
  #info { min-height:44px; color:var(--blue); margin:8px 0; }
  #info b { color:var(--fg); }
  .sfb { color:var(--pink); }
  #pad { margin-top:14px; padding:14px; border-radius:10px; background:#191b21; outline:none; border:1px solid #262a33; cursor:text; }
  #pad:focus { border-color:var(--blue); }
  #target { text-align:center; font-size:24px; letter-spacing:.02em; white-space:pre-wrap; min-height:34px; }
  #target .ok { color:var(--mint); } #target .er { color:var(--bg); background:var(--pink); border-radius:2px; } #target .cur { border-bottom:2px solid var(--blue); } #target .todo { color:#8a93a6; }
  #padstat { text-align:center; color:var(--blue); font-size:12px; margin-top:6px; }
  .hint { color:var(--dim); font-size:12px; }
  #left > .hint { text-align:center; }
  #worst span { display:inline-block; margin-right:12px; }
</style>
</head>
<body>
<div id="left">
  <h1>русский галлий · lily58</h1>
  <div id="board"></div>
  <div class="hint">click two keys = swap · shift-click = pin/unpin · hover = what hurts there · esc = drop selection</div>
  <div id="pad" tabindex="0" role="textbox">
    <div id="target"></div>
    <div id="padstat">click here and type on the board. enter = next line, tab = hide the hint keys</div>
  </div>
</div>
<div id="right">
  <div id="score">—</div>
  <table id="metrics"></table>
  <div class="row" id="presets"></div>
  <div class="row">
    <button id="opt">optimize unpinned</button>
    <button id="undo">undo</button>
    <button id="heat">heat</button>
    <button id="copy">copy json</button>
    <button id="paste">paste json</button>
  </div>
  <div id="info"></div>
  <div class="hint">worst same-finger pairs (freq % × distance):</div>
  <div id="worst"></div>
</div>
<script>
/*SCORE*/
const D = /*DATA*/;
const N = D.alpha.length, NAMES = D.seats.map(s => s.n), SI = Object.fromEntries(NAMES.map((n, i) => [n, i]));
const CI = Object.fromEntries(D.alpha.map((c, i) => [c, i]));
const SC = makeScorer(D);
const TWIN = { "с":"c","т":"t","н":"n","р":"r","м":"m","л":"l","д":"d","п":"p","з":"z","б":"b","г":"g","ф":"f","а":"a","е":"e","и":"i","о":"o","у":"u","й":"j","к":"k","в":"v","х":"h","ы":"y" };
const YC = D.presets["йцукен"].map, ycPos = D.alpha.map(c => SI[YC[c]]);
const ycScore = SC.metrics(ycPos).total;

let pos, pinned, base, sel = null, heat = false, history = [];
const U = 54, OFF = [14, 14, 4, 0, 6, 8];
const L = [["Esc","1","2","3","4","5"],["Tab","q","w","e","r","t"],["`","a","s","d","f","g"],["shift","z","x","c","v","b"]];
const R = [["6","7","8","9","0","]"],["y","u","i","o","p","["],["h","j","k","l",";","?"],["n","m",",",".","/","shift"]];
const keys = [];
L.forEach((row, r) => row.forEach((n, c) => keys.push({ n, x: c * U, y: r * U + OFF[c] })));
keys.push({ n: "=", x: 6 * U, y: 3 * U + 22 });
const RX = 8.9 * U;
R.forEach((row, r) => row.forEach((n, c) => keys.push({ n, x: RX + c * U, y: r * U + OFF[5 - c] })));
keys.push({ n: "-", x: RX - U, y: 3 * U + 22 });
[["F19",2.7],["⌃",3.7],["⌘",4.7],["␣ alt",5.9]].forEach(([n, x], i) => keys.push({ n, x: x * U, y: 4 * U + 18 + (i === 3 ? 12 : 0), ns: true }));
[["⏎",RX - 1.9 * U],["⌘",RX - 0.7 * U],["⌫",RX + 0.3 * U],["F19",RX + 1.3 * U]].forEach(([n, x], i) => keys.push({ n, x, y: 4 * U + 18 + (i === 0 ? 12 : 0), ns: true }));

const board = document.getElementById("board"), els = {};
for (const k of keys) {
  const d = document.createElement("div");
  d.className = "k";
  d.style.left = k.x + "px"; d.style.top = k.y + "px";
  if (!k.ns && k.n in SI) {
    d.classList.add("seat");
    els[k.n] = d;
    d.addEventListener("click", e => clickSeat(k.n, e.shiftKey));
    d.addEventListener("mouseenter", () => hover(k.n));
    d.addEventListener("mouseleave", () => { document.getElementById("info").innerHTML = ""; render(); });
  } else { d.classList.add("ns"); d.textContent = k.n; }
  board.appendChild(d);
}

function at(seat) { const s = SI[seat]; const c = pos.indexOf(s); return c >= 0 ? c : null; }

function render(partners) {
  for (const n in els) {
    const d = els[n], c = at(n), ch = c === null ? "" : D.alpha[c];
    const gl = D.gallium[n] ?? n;
    d.innerHTML = `<span class="gl">${gl}</span><span class="cy">${ch}</span>` + (heat && c !== null ? `<span class="freq">${(100 * D.uni[c]).toFixed(1)}</span>` : "");
    d.className = "k seat";
    if (ch && TWIN[ch] && D.gallium[n] === TWIN[ch]) d.classList.add("twin");
    if (c !== null && pinned[c]) d.classList.add("pin");
    if (sel === n) d.classList.add("sel");
    if (partners && partners.has(n)) d.classList.add("partner");
    if (heat && c !== null) d.style.background = `rgba(127,209,185,${Math.min(0.55, D.uni[c] * 5.5)})`;
    else d.style.background = "";
  }
  const { total, m } = SC.metrics(pos), b = SC.metrics(base).m;
  document.getElementById("score").innerHTML = total.toFixed(1) + `<small>йцукен ${ycScore.toFixed(0)} · lower is better</small>`;
  const names = { effort:"effort", sfb:"same finger", sfs:"same finger, skip one", lsb:"index stretch", scissor:"scissors", redirect:"redirects", redirect_bad:"redirects, no index", inroll:"inward rolls", outroll:"outward rolls" };
  document.getElementById("metrics").innerHTML = Object.keys(names).map(k => {
    const dv = m[k] - b[k], good = D.W[k] < 0 ? dv > 0 : dv < 0;
    const ds = Math.abs(dv) < 0.005 ? "" : (dv > 0 ? "+" : "") + dv.toFixed(2);
    return `<tr><td class="l">${names[k]}</td><td class="v">${m[k].toFixed(2)}</td><td class="d ${ds ? (good ? "dn" : "up") : ""}">${ds}</td></tr>`;
  }).join("");
  document.getElementById("worst").innerHTML = SC.sfbList(pos, 10).map(([bg, f, w]) => `<span><span class="sfb">${bg}</span> ${f.toFixed(2)}×${w.toFixed(1)}</span>`).join("");
  localStorage.setItem("rulayout2", JSON.stringify({ map: toMap(), pins: D.alpha.filter((c, i) => pinned[i]) }));
}

function toMap() { return Object.fromEntries(D.alpha.map((c, i) => [c, NAMES[pos[i]]])); }
function load(map, pins, keepBase) {
  pos = D.alpha.map(c => SI[map[c]]);
  pinned = D.alpha.map(c => pins.includes(c));
  if (!keepBase) base = pos.slice();
  sel = null; render(); updatePad();
}
function snap() { history.push([pos.slice(), pinned.slice()]); if (history.length > 200) history.shift(); }

function clickSeat(n, shift) {
  const c = at(n);
  if (shift) { if (c !== null) { snap(); pinned[c] = !pinned[c]; } render(); return; }
  if (sel === null) { sel = n; render(); return; }
  if (sel === n) { sel = null; render(); return; }
  const a = at(sel), b = c;
  if ((a !== null && pinned[a]) || (b !== null && pinned[b])) {
    [sel, n].forEach(s => { els[s].classList.remove("bad"); void els[s].offsetWidth; els[s].classList.add("bad"); });
    sel = null; setTimeout(render, 360); return;
  }
  snap();
  const sa = SI[sel], sb = SI[n];
  if (a !== null) pos[a] = sb;
  if (b !== null) pos[b] = sa;
  sel = null; render(); updatePad();
}

function hover(n) {
  const c = at(n); if (c === null) return;
  const ch = D.alpha[c], S = SC.S, partners = new Set(), rows = [];
  for (let o = 0; o < N; o++) {
    if (o === c) continue;
    const w = SC.SFB[pos[c] * S + pos[o]];
    if (!w) continue;
    const f = 100 * (D.bi[c * N + o] + D.bi[o * N + c]);
    if (f > 0.005) rows.push([ch + D.alpha[o], f, w]);
    partners.add(NAMES[pos[o]]);
  }
  rows.sort((x, y) => y[1] * y[2] - x[1] * x[2]);
  const gl = D.gallium[n] ?? n;
  document.getElementById("info").innerHTML = `<b>${ch}</b> ${(100 * D.uni[c]).toFixed(2)}% · gallium key <b>${gl}</b>${pinned[c] ? " · pinned" : ""}<br>same finger with: ` +
    (rows.length ? rows.slice(0, 6).map(([b, f]) => `<span class="sfb">${b}</span> ${f.toFixed(2)}%`).join(" · ") : "nothing worth a damn");
  render(partners);
}

let seed = 1;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
document.getElementById("opt").onclick = async () => {
  const btn = document.getElementById("opt"); btn.textContent = "thinking…"; btn.disabled = true;
  snap();
  let best = [SC.fast(pos), pos.slice()];
  seed = Date.now() >>> 0;
  for (let r = 0; r < 8; r++) {
    await new Promise(res => setTimeout(res, 10));
    const got = SC.anneal(pos, pinned, 40000, rnd);
    if (got[0] < best[0]) best = got;
    btn.textContent = `thinking… ${r + 1}/8`;
  }
  pos = best[1]; btn.textContent = "optimize unpinned"; btn.disabled = false; render(); updatePad();
};
document.getElementById("undo").onclick = () => { const h = history.pop(); if (h) { [pos, pinned] = h; render(); updatePad(); } };
document.getElementById("heat").onclick = e => { heat = !heat; e.target.classList.toggle("on", heat); render(); };
document.getElementById("copy").onclick = () => navigator.clipboard.writeText(JSON.stringify({ map: toMap(), pins: D.alpha.filter((c, i) => pinned[i]) }, null, 1));
document.getElementById("paste").onclick = () => { const t = prompt("paste the json"); if (t) { snap(); const j = JSON.parse(t); load(j.map, j.pins || [], true); } };
const pr = document.getElementById("presets");
for (const [name, p] of Object.entries(D.presets)) {
  const b = document.createElement("button"); b.textContent = name;
  b.onclick = () => { snap(); load(p.map, p.pins); };
  pr.appendChild(b);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement !== pad) { sel = null; render(); } });

// typing pad: the board sends qwerty scancodes, karabiner turns them into gallium (english input) or leaves them raw (russian input)
const GINV = Object.fromEntries(Object.entries(D.gallium).map(([q, g]) => [g, q]));
const CODE = { Comma: ",", Period: ".", Semicolon: ";", Quote: "'", Slash: "/", BracketLeft: "[", BracketRight: "]", Backquote: "`", Equal: "=", Minus: "-" };
function seatOf(e) {
  let k = e.code.startsWith("Key") ? e.code.slice(3).toLowerCase() : CODE[e.code];
  if (!k) return null;
  const raw = /[а-яё]/i.test(e.key);
  if (!raw && GINV[k]) return GINV[k];
  return k in SI ? k : null;
}
const pad = document.getElementById("pad");
let line = "", typed = [], hints = true, lineNo = Math.floor(Math.random() * D.lines.length), t0 = null, strokes = 0, errs = 0;
function nextLine() { line = D.lines[lineNo++ % D.lines.length]; typed = []; t0 = null; updatePad(); }
function updatePad() {
  if (!line) return;
  let h = "";
  for (let i = 0; i < line.length; i++) {
    const ch = line[i] === " " ? " " : line[i];
    if (i < typed.length) h += `<span class="${typed[i] === line[i] ? "ok" : "er"}">${ch}</span>`;
    else h += `<span class="${i === typed.length ? "cur todo" : "todo"}">${ch}</span>`;
  }
  document.getElementById("target").innerHTML = h;
  for (const n in els) els[n].classList.remove("next");
  const nc = line[typed.length];
  if (hints && nc && nc !== " " && document.activeElement === pad) { const s = NAMES[pos[CI[nc]]]; if (els[s]) els[s].classList.add("next"); }
}
pad.addEventListener("focus", updatePad);
pad.addEventListener("blur", () => { for (const n in els) els[n].classList.remove("next"); });
pad.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  e.preventDefault();
  if (e.key === "Enter") return nextLine();
  if (e.key === "Tab") { hints = !hints; return updatePad(); }
  if (e.key === "Escape") return pad.blur();
  if (e.key === "Backspace") { typed.pop(); return updatePad(); }
  let ch = null;
  if (e.code === "Space") ch = " ";
  else { const s = seatOf(e); if (s) { const c = at(s); if (c !== null) ch = D.alpha[c]; flash(s); } }
  if (ch === null || typed.length >= line.length) return;
  if (t0 === null) t0 = performance.now();
  typed.push(ch); strokes++; if (ch !== line[typed.length - 1]) errs++;
  if (typed.length === line.length) {
    const min = (performance.now() - t0) / 60000, wpm = (line.length / 5) / min;
    document.getElementById("padstat").textContent = `${wpm.toFixed(0)} wpm · ${(100 * (1 - errs / Math.max(1, strokes))).toFixed(0)}% clean this session · enter = next`;
  }
  updatePad();
});
function flash(s) { const d = els[s]; if (!d) return; d.classList.add("hit"); setTimeout(() => d.classList.remove("hit"), 140); }

const saved = JSON.parse(localStorage.getItem("rulayout2") || "null");
if (saved) load(saved.map, saved.pins); else load(D.presets["twin draft"].map, D.presets["twin draft"].pins);
nextLine();
</script>
</body>
</html>
