<!doctype html>
<html><head><meta charset="utf-8"><title>lily58 oled</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0d; color: #8a8f98; font: 13px ui-monospace, Menlo, monospace; }
  #wrap { display: flex; gap: 40px; padding: 24px; align-items: flex-start; }
  #board { display: block; }
  #big { display: flex; gap: 28px; }
  .bigp { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bigp canvas { display: block; }
  #ui { display: flex; flex-direction: column; gap: 10px; min-width: 240px; max-width: 300px; }
  select, button { background: #16171b; color: #cfd3da; border: 1px solid #2a2c33; padding: 4px 8px; font: inherit; }
  label { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .k { color: #cfd3da; }
  #keys { color: #555; }
  #keys.hit { color: #cfd3da; }
</style></head>
<body>
<div id="wrap">
  <div>
    <canvas id="board"></canvas>
    <div id="big">
      <div class="bigp"><canvas id="bl"></canvas><span>left (central)</span></div>
      <div class="bigp"><canvas id="br"></canvas><span>right (peripheral)</span></div>
    </div>
  </div>
  <div id="ui">
    <label>left <select id="al"></select></label>
    <label>right <select id="ar"></select></label>
    <label>colour <select id="col">
      <option value="#eef6ff">white</option>
      <option value="#3fb6ff">blue</option>
      <option value="#2be8ff">cyan</option>
      <option value="#ff2bd6">magenta</option>
    </select></label>
    <label>speed <select id="spd">
      <option>0.25</option><option>0.5</option><option selected>1</option><option>2</option>
      <option>5</option><option>20</option><option>100</option><option>600</option>
    </select></label>
    <label>glow <input id="glow" type="range" min="0" max="1" step="0.05" value="0.55"></label>
    <label><span>burn map</span><input id="burn" type="checkbox"></label>
    <label>strike every <input id="every" type="range" min="2" max="100" step="1" value="10"><span id="everyv" class="k">10</span></label>
    <label><span>typist (simulated hands)</span><input id="typist" type="checkbox"></label>
    <div><button id="play">pause</button> <button id="step">step</button> <button id="strike">strike</button> <button id="reset">reset</button></div>
    <div id="keys">type anywhere: keys hit both screens</div>
    <div id="info"></div>
    <div style="color:#555">esc pause · → step · the burn map of a live screen counts since reset; warp the speed to live a day</div>
  </div>
</div>
<script src="frames.js?v=2"></script>
<script src="live.js?v=2"></script>
<script>
const D = window.ANIMS, W = D.w, H = D.h, LIVE = window.LIVE, TICK = window.LIVE_TICK;
const $ = id => document.getElementById(id);

const decoded = {};
for (const [name, a] of Object.entries(D.anims)) {
  decoded[name] = a.frames.map(b64 => {
    const s = atob(b64), bits = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) bits[i] = (s.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;
    return bits;
  });
}
const bakedHeat = {};
for (const [name, fr] of Object.entries(decoded)) {
  const h = new Float32Array(W * H);
  for (const b of fr) for (let i = 0; i < W * H; i++) h[i] += b[i];
  for (let i = 0; i < W * H; i++) h[i] /= fr.length;
  bakedHeat[name] = h;
}

const names = [...Object.keys(LIVE), ...Object.keys(D.anims)];
for (const sel of [$('al'), $('ar')]) {
  const live = document.createElement('optgroup'); live.label = 'live';
  for (const n of Object.keys(LIVE)) live.appendChild(new Option(n, n));
  const baked = document.createElement('optgroup'); baked.label = 'baked';
  for (const n of Object.keys(D.anims)) baked.appendChild(new Option(n, n));
  sel.append(live, baked);
}
const saved = JSON.parse(localStorage.oledEmu || '{}');
$('al').value = names.includes(saved.al) ? saved.al : 'wire';
$('ar').value = names.includes(saved.ar) ? saved.ar : 'rain';
if (saved.col) $('col').value = saved.col;
if (saved.every) { $('every').value = saved.every; $('everyv').textContent = saved.every; }
const save = () => localStorage.oledEmu = JSON.stringify({ al: $('al').value, ar: $('ar').value, col: $('col').value, every: $('every').value });

// one screen's state: a baked loop, or a live program with its own buffer and burn tally
const sides = {};
function setSide(k, name) {
  const s = sides[k] = { name, bits: new Uint8Array(W * H), sum: new Float32Array(W * H), ticks: 0, st: null };
  if (LIVE[name]) {
    s.st = LIVE[name].init(window.LIVE_XS((Math.random() * 2 ** 32) >>> 0));
    if ('every' in s.st) s.st.every = +$('every').value;
    LIVE[name].draw(s.st, s.bits);
  }
}
const fr = n => Math.floor(T * D.anims[n].fps / 1000);
const bitsOf = s => s.st ? s.bits : decoded[s.name][fr(s.name) % decoded[s.name].length];
function heatOf(s) {
  if (!s.st) return bakedHeat[s.name];
  const h = new Float32Array(W * H), n = Math.max(1, s.ticks);
  for (let i = 0; i < W * H; i++) h[i] = s.sum[i] / n;
  return h;
}

// a 0.91" SSD1306: 128x32 on a 0.175 mm pitch, pixels 0.159 mm, glass about 11.5 x 30 mm.
const PITCH_MM = 0.175, FILL = 0.159 / 0.175, KEY_MM = 19.05;
const BIG = 4.5;
const glassPad = { x: (11.5 - W * PITCH_MM) / 2, top: 2.2, bot: 30 - H * PITCH_MM - 2.2 };

function panel(canvas, pitch, s) {
  const gx = glassPad.x / PITCH_MM * pitch, gt = glassPad.top / PITCH_MM * pitch, gb = glassPad.bot / PITCH_MM * pitch;
  const cw = Math.round(W * pitch + 2 * gx), ch = Math.round(H * pitch + gt + gb);
  if (canvas.width !== cw) { canvas.width = cw; canvas.height = ch; }
  const c = canvas.getContext('2d');
  c.fillStyle = '#060607'; c.fillRect(0, 0, cw, ch);
  c.strokeStyle = '#1c1d22'; c.lineWidth = 1; c.strokeRect(0.5, 0.5, cw - 1, ch - 1);
  c.fillStyle = '#000'; c.fillRect(gx, gt, W * pitch, H * pitch);
  const col = $('col').value, sz = pitch * FILL;
  if ($('burn').checked) {
    const h = heatOf(s);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = h[y * W + x]; if (!v) continue;
      c.fillStyle = `hsl(${(1 - v) * 60}, 100%, ${20 + v * 40}%)`;
      c.fillRect(gx + x * pitch, gt + y * pitch, sz, sz);
    }
  } else {
    const bits = bitsOf(s);
    const lit = new Path2D();
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      if (bits[y * W + x]) lit.rect(gx + x * pitch, gt + y * pitch, sz, sz);
    const g = +$('glow').value;
    if (g > 0) {
      c.save(); c.filter = `blur(${pitch * 1.4}px)`; c.globalAlpha = g; c.fillStyle = col; c.fill(lit); c.restore();
    }
    c.fillStyle = col; c.fill(lit);
  }
  const ref = c.createLinearGradient(0, 0, cw, ch);
  ref.addColorStop(0, 'rgba(255,255,255,0.05)'); ref.addColorStop(0.35, 'rgba(255,255,255,0)');
  c.fillStyle = ref; c.fillRect(0, 0, cw, ch);
}

// the left half of a lily58, in key units; the right is its mirror. stagger and seats are near enough.
const STAG = [0.45, 0.45, 0.15, 0, 0.15, 0.3];
function keysLeft() {
  const k = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) k.push({ x: c, y: r + STAG[c] });
  k.push({ x: 6, y: 3 + 0.45 });
  [2, 3, 4].forEach(c => k.push({ x: c + 0.5, y: 4 + STAG[c] * 0.5 + 0.1 }));
  k.push({ x: 5.7, y: 4.45, rot: 30 });
  return k;
}
const U = 44, GAP = 2.2;
const oledAt = { x: 6.05, y: 0.15 };

const offL = document.createElement('canvas'), offR = document.createElement('canvas');
function board() {
  const cv = $('board'), totalU = 7.5 * 2 + GAP;
  cv.width = totalU * U + 20; cv.height = 5.6 * U + 20;
  const c = cv.getContext('2d');
  c.fillStyle = '#0b0b0d'; c.fillRect(0, 0, cv.width, cv.height);
  const pitch = U / KEY_MM * PITCH_MM * 4;
  panel(offL, pitch, sides.l); panel(offR, pitch, sides.r);
  for (const side of [0, 1]) {
    c.save(); c.translate(10, 10);
    if (side) { c.translate(totalU * U, 0); c.scale(-1, 1); }
    c.fillStyle = '#121317'; c.strokeStyle = '#24262d';
    c.beginPath(); c.roundRect(-0.15 * U, -0.15 * U, 7.5 * U, 5.45 * U, 10); c.fill(); c.stroke();
    for (const k of keysLeft()) {
      c.save(); c.translate((k.x + 0.5) * U, (k.y + 0.5) * U); if (k.rot) c.rotate(k.rot * Math.PI / 180);
      c.fillStyle = '#1b1d22'; c.strokeStyle = '#2c2f37';
      c.beginPath(); c.roundRect(-0.46 * U, -0.46 * U, 0.92 * U, 0.92 * U, 5); c.fill(); c.stroke();
      c.restore();
    }
    c.restore();
    const src = side ? offR : offL, sw = src.width / 4, sh = src.height / 4;
    const cx = 10 + (side ? totalU * U - (oledAt.x + 0.6) * U - sw / 2 : (oledAt.x + 0.6) * U - sw / 2);
    c.drawImage(src, cx, 10 + oledAt.y * U + 0.2 * U, sw, sh);
  }
}

let T = 0, acc = 0, simT = 0, typed = 0, playing = true, last = performance.now();
const typist = { next: 0, burst: 0 };
function schedule() {
  const r = Math.random;
  if (typist.burst > 0) { typist.burst--; typist.next += 90 + r() * 220; }
  else { typist.burst = 3 + (r() * 40 | 0); typist.next += r() < 0.75 ? 800 + r() * 7000 : 15000 + r() * 90000; }
}
let flashT = 0;
function press(code) {
  typed++;
  for (const s of Object.values(sides)) if (s.st) LIVE[s.name].key(s.st, code);
  if (performance.now() - flashT > 60) { flashT = performance.now(); $('keys').classList.add('hit'); setTimeout(() => $('keys').classList.remove('hit'), 80); }
}
function tickLive() {
  simT += TICK;
  while ($('typist').checked && typist.next <= simT) { press((Math.random() * 64) | 0); schedule(); }
  for (const s of Object.values(sides)) if (s.st) {
    const L = LIVE[s.name];
    L.step(s.st); s.bits.fill(0); L.draw(s.st, s.bits);
    for (let i = 0; i < W * H; i++) s.sum[i] += s.bits[i];
    s.ticks++;
  }
}

const hms = ms => { const m = Math.floor(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}` : `${m}m${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}s`; };
function draw() {
  panel($('bl'), BIG, sides.l); panel($('br'), BIG, sides.r);
  board();
  const lit = s => { let n = 0; for (const x of bitsOf(s)) n += x; return n; };
  const hot = s => Math.max(...heatOf(s));
  $('info').innerHTML = [['left', sides.l], ['right', sides.r]].map(([side, s]) => {
    const head = s.st
      ? `live · ${LIVE[s.name].info(s.st)}<br>burn over ${hms(s.ticks * TICK)}`
      : `${decoded[s.name].length} frames · ${D.anims[s.name].fps} fps · ${(decoded[s.name].length * 520 / 1024).toFixed(0)} KB`;
    return `${side}: <span class="k">${s.name}</span><br>${head}<br>lit now ${lit(s)}/${W * H} · hottest px ${(hot(s) * 100).toFixed(0)}%`;
  }).join('<br><br>') + `<br><br>keys ${typed} · sim ${hms(simT)}`;
}
let lastInfo = 0;
function tick(t) {
  if (playing) {
    const dt = Math.min(t - last, 100) * +$('spd').value;
    T += dt; acc += dt;
    let n = 0;
    while (acc >= TICK && n < 2000) { acc -= TICK; tickLive(); n++; }
    if (acc >= TICK) acc = 0;
    draw();
  }
  last = t; requestAnimationFrame(tick);
}
function reset() { setSide('l', $('al').value); setSide('r', $('ar').value); simT = 0; typed = 0; typist.next = 0; draw(); }
for (const id of ['al', 'ar']) $(id).onchange = () => { save(); setSide(id === 'al' ? 'l' : 'r', $(id).value); $(id).blur(); draw(); };
for (const id of ['col', 'glow', 'burn', 'spd']) $(id).onchange = $(id).oninput = () => { save(); $(id).blur(); draw(); };
$('every').oninput = () => {
  $('everyv').textContent = $('every').value; save();
  for (const s of Object.values(sides)) if (s.st && 'every' in s.st) s.st.every = +$('every').value;
};
$('every').onchange = () => $('every').blur();
$('typist').onchange = () => { typist.next = simT; $('typist').blur(); };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'pause' : 'play'; $('play').blur(); };
$('step').onclick = () => { T += TICK; tickLive(); draw(); $('step').blur(); };
$('strike').onclick = () => { for (const s of Object.values(sides)) if (s.st && LIVE[s.name].strike) LIVE[s.name].strike(s.st); $('strike').blur(); };
$('reset').onclick = () => { reset(); $('reset').blur(); };
const hash = str => { let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) | 0; return (h >>> 0) % 64; };
addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('play').click(); return; }
  if (e.key === 'ArrowRight') { $('step').click(); return; }
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  press(hash(e.code));
});
reset(); requestAnimationFrame(tick);
</script>
</body></html>
