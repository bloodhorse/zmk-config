<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>русский галлий</title>
<style>
  :root { --bg:#14161b; --key:#22252d; --key2:#2a2e38; --dim:#4a5060; --fg:#dde3ee; --mint:#7fd1b9; --pink:#e58fb7; --blue:#7fb6e5; --u:54px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-monospace, "SF Mono", Menlo, monospace; display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 24px; }
  #left { flex:0 0 auto; width:calc(var(--u) * 14.9); }
  #right { order:-1; width:calc(var(--u) * 14.9); }
  h1 { text-align:center; font-size:15px; font-weight:600; color:var(--blue); margin:0 0 14px; letter-spacing:.04em; }
  #board { position:relative; width:calc(var(--u) * 14.9); height:calc(var(--u) * 5.6); }
  .k { position:absolute; width:calc(var(--u) - 5px); height:calc(var(--u) - 5px); border-radius:8px; background:var(--key); display:flex; align-items:center; justify-content:center; user-select:none; transition:background .12s, box-shadow .12s; }
  .k.ns { background:#1b1d23; color:var(--dim); font-size:11px; }
  .k.seat { cursor:pointer; }
  .k.seat:hover { background:var(--key2); }
  .k .cy { font-size:24px; font-weight:500; }
  .k .gl { position:absolute; top:3px; left:6px; font-size:10px; color:var(--dim); }
  .k.twin .cy { color:var(--mint); }
  .k.twin .gl { color:var(--mint); opacity:.7; }
  .k.pin { box-shadow: inset 0 0 0 2px var(--mint); }
  .k.sel { box-shadow: inset 0 0 0 2px var(--blue); background:#2b3443; }
  .k.bad { animation: bad .35s; }
  @keyframes bad { 0%,100% { background:var(--key); } 50% { background:var(--pink); } }
  .k.next { background:#263848; box-shadow: inset 0 0 0 2px var(--blue); }
  .k.hit { background:#2d4a43; }
  .k .alt { position:absolute; top:3px; right:6px; font-size:12px; color:var(--blue); }
  .k .freq { position:absolute; bottom:2px; right:5px; font-size:9px; color:var(--dim); }
  .k.partner { box-shadow: inset 0 0 0 2px var(--pink); }
  #score { font-size:40px; font-weight:600; color:var(--mint); }
  #score small { font-size:13px; color:var(--blue); font-weight:400; margin-left:10px; }
  table { border-collapse:collapse; }
  td { padding:1px 10px 1px 0; }
  td.v { text-align:right; color:var(--fg); }
  td.l { color:var(--blue); }
  td.d.up { color:var(--pink); } td.d.dn { color:var(--mint); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  button { background:var(--key); color:var(--fg); border:1px solid #333845; border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  button.on { border-color:var(--mint); color:var(--mint); }
  #info { min-height:44px; color:var(--blue); margin:8px 0; }
  #info b { color:var(--fg); }
  .sfb { color:var(--pink); }
  #pad { margin-top:14px; padding:14px; border-radius:10px; background:#191b21; border:1px solid #262a33; }
  body:focus { outline:none; }
  
  #target { text-align:center; font-size:24px; letter-spacing:.02em; white-space:pre-wrap; min-height:34px; }
  #target .ok { color:var(--mint); } #target .er { color:var(--bg); background:var(--pink); border-radius:2px; } #target .cur { border-bottom:2px solid var(--blue); } #target .todo { color:#8a93a6; }
  #padstat { text-align:center; color:var(--blue); font-size:12px; margin-top:6px; }
  .hint { color:var(--dim); font-size:12px; }
  #left > .hint { text-align:center; }
  #worst span { display:inline-block; margin-right:12px; }
</style>
</head>
<body role="textbox">
<div id="left">
  <h1>русский галлий · lily58</h1>
  <div id="board"></div>
  <div class="hint">click two keys = swap · shift-click = pin/unpin · hover = what hurts there · esc = drop selection</div>
  <div id="pad">
    <div id="target"></div>
    <div id="padstat">just type on the board. enter = next line, tab = hide the hint keys</div>
  </div>
</div>
<div id="right">
  <div id="score">—</div>
  <table id="metrics"></table>
  <div class="row" id="presets"></div>
  <div class="row">
    <button id="opt">optimize unpinned</button>
    <button id="undo">undo</button>
    <button id="heat">heat</button>
    <button id="copy">copy json</button>
    <button id="paste">paste json</button>
  </div>
  <div id="info"></div>
  <div class="hint">worst same-finger pairs (freq % × distance):</div>
  <div id="worst"></div>
</div>

  for (const n in els) els[n].classList.remove("next");
  const nc = line[typed.length];
  if (hints && nc && nc !== " ") { const s = NAMES[pos[CI[nc]]]; if (els[s]) els[s].classList.add("next"); }
}
document.addEventListener("keydown", e => {
  const altOnly = e.altKey && !e.metaKey && !e.ctrlKey;
  const chordSeat = altOnly && e.key === "Enter" ? "alt+⏎" : altOnly && seatOf(e) === NAMES[pos[CI["ь"]]] ? "chord" : null;
  if (!chordSeat && (e.metaKey || e.ctrlKey || e.altKey)) return;
  e.preventDefault();
  if (e.key === "Enter" && !chordSeat) return nextLine();
  if (e.key === "Tab") { hints = !hints; return updatePad(); }
  if (e.key === "Escape") { sel = null; return render(); }
  if (e.key === "Backspace") { typed.pop(); return updatePad(); }
  let ch = null;
  if (e.code === "Space") ch = " ";
  else { const s = chordSeat || seatOf(e); if (s) { const c = at(s); if (c !== null) ch = D.alpha[c]; flash(s); } }
  if (ch === null || typed.length >= line.length) return;
  if (t0 === null) t0 = performance.now();
  typed.push(ch); strokes++; if (ch !== line[typed.length - 1]) errs++;
  if (typed.length === line.length) {
    const min = (performance.now() - t0) / 60000, wpm = (line.length / 5) / min;
    document.getElementById("padstat").textContent = `${wpm.toFixed(0)} wpm · ${(100 * (1 - errs / Math.max(1, strokes))).toFixed(0)}% clean this session · enter = next`;
  }
  updatePad();
});
function flash(s) { const d = els[s]; if (!d) return; d.classList.add("hit"); setTimeout(() => d.classList.remove("hit"), 140); }

const saved = JSON.parse(localStorage.getItem("rulayout2") || "null");
if (saved) load(saved.map, saved.pins); else load(D.presets["twin draft"].map, D.presets["twin draft"].pins);
nextLine();
